name: Design system audit

on:
  push:
    branches:
      - development

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create source archive and inventory
        shell: bash
        run: |
          find . -type f -not -path './.git/*' | sort > repository-tree.txt
          tar --exclude=.git -czf source-snapshot.tar.gz .

      - name: Upload audit bundle
        uses: actions/upload-artifact@v4
        with:
          name: design-system-audit
          path: |
            repository-tree.txt
            source-snapshot.tar.gz
          retention-days: 1
