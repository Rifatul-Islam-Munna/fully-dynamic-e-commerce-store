name: Redesign validation report

on:
  push:
    branches:
      - development

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Validate applications
        shell: bash
        run: |
          set +e
          (cd frontend && npm ci && npm run build) > frontend-validation.log 2>&1
          FRONTEND_STATUS=$?
          (cd backend && npm ci && npm run build) > backend-validation.log 2>&1
          BACKEND_STATUS=$?

          {
            echo "Frontend build status: ${FRONTEND_STATUS}"
            echo "Backend build status: ${BACKEND_STATUS}"
            echo
            echo "--- Frontend build tail ---"
            tail -n 160 frontend-validation.log
            echo
            echo "--- Backend build tail ---"
            tail -n 160 backend-validation.log
          } > redesign-build-status.txt
      - name: Publish validation report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add redesign-build-status.txt
          git commit -m "chore: publish redesign build report [skip ci]"
          git push origin HEAD:development
