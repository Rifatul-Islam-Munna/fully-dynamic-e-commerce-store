name: Design audit PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build repository inventory
        run: |
          find . -type f -not -path './.git/*' | sort > repository-tree.txt
          tar --exclude=.git -czf source-snapshot.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: design-system-audit
          path: |
            repository-tree.txt
            source-snapshot.tar.gz
          retention-days: 1
